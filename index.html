<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poézine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tiny.css@0.12/dist/tiny.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* tiny.css restyles the elements it knows about, but the surfaces
               the browser paints itself (the canvas outside the body box, the
               overscroll area, scrollbars, the strip behind the iOS status bar
               under viewport-fit=cover) stay light until the page declares
               which schemes it supports */
            color-scheme: light dark;
        }

        * {
            font-family: "Inria Serif";
            scroll-behavior: smooth;
        }

        a {
            color: var(--text-main);
            font-weight: 500;
            text-decoration: none;
        }

        body {
            margin-top: 0;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            display: flex;
            flex-direction: row;
            gap: 2em;
            justify-content: center;
        }

        body:has(.focus) {
            justify-content: flex-start;
        }

        .main {
            padding-top: 0;
        }

        footer {
            /* tiny.css gives footers 1rem top padding; zero it so the
               height is exactly 2em */
            height: 2em;
            padding: 0;
            flex: none;
        }

        nav {
            /* with viewport-fit=cover the page starts at the physical screen
               top; keep the menu content below the notch / status bar */
            padding-top: env(safe-area-inset-top, 0px);
        }

        nav {
            display: block;
            text-align: right;
            min-width: 25ch;
            width: 35%;
            background-color: var(--background-body);
        }

        .main div {
            min-width: 50ch;
        }

        section>p:first-child {
            padding-top: 3em;
        }

        section {
            /* larger than the sticky nav can ever be, so anchor scrolls clamp
               to the document top instead of hiding the first lines under it */
            scroll-margin-top: 100vh;
        }

        .hidden {
            display: none
        }

        /* :target covers in-page navigation, where the browser applies it
           before scrolling to the poem; .shown covers arriving with the hash
           already set, where the sections do not exist yet at that moment */
        .hidden:target,
        .hidden.shown {
            display: block;
        }

        #mymenu {
            /* width: 25ch; */
            position: sticky;
            padding-top: 1em;
            top: 0;
            background-color: var(--background-body);
        }

        p {
            padding: 0 1em;
            line-height: 1.5em;
        }

        #mymenu:not(:has(.focus)) {
            text-align: center;
        }


        /* collapsed state */
        nav:has(.focus):not(:hover):not(:focus-within):not(.open) .poemtitle:not(.focus) {
            display: none;
        }

        /* expanded state */
        nav:has(.focus):is(:hover, :focus-within) .poemtitle:not(.focus) {
            display: block;
            opacity: 0.4;
        }

        .poemtitle {
            font-size: 1.1rem;
            display: block;

            &:hover {
                font-style: italic;
            }
        }

        @media (max-width: 80ch) {
            section>p:first-child {
                padding-top: 0;
            }

            nav {
                text-align: center;
                position: sticky;
                top: 0;
                width: 100%;
                min-width: 0;
            }

            #mymenu {
                position: relative;
                width: 100%;
                padding-bottom: 1em;
            }

            body {
                flex-direction: column;
                margin: 0;
                max-width: none;
                gap: 0;
            }
        }

        @media(pointer: coarse) {
            /* touch expansion is driven by the .open class set in JS;
               iOS neither focuses tapped links nor clears simulated
               hover reliably, so :hover / :focus-within can't be trusted */
            nav.open .poemtitle {
                display: block;
            }

            nav:has(.focus):not(.open) .poemtitle:not(.focus) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div id="mymenu"></div>
    </nav>
    <div class="main">
        <!-- <div id="litanie">Loading...</div>
        <div id="ciel-de-traine">Loading...</div>
        <div id="jardin-de-ville">Loading...</div>
        <div id="architecture-moderne">Loading...</div> -->
    </div>
    <footer></footer>
    <script src="
https://cdn.jsdelivr.net/npm/umbrellajs@3.3.3/umbrella.min.js
"></script>
    <script>
        [
            { file: "Ciel de traine", id: "ciel-de-traine" },
            { file: "Architecture moderne", id: "architecture-moderne" },
            { file: "Jardin de ville", id: "jardin-de-ville" },
            { file: "Litanie des objets perdus", id: "litanie" },
            { file: "Cohérence du discours poetique", id: "coherence" },
            { file: "Saint-Sylvestre", id: "saint-sylvestre" },
            { file: "Je cherche un café", id: "cafe" },
        ].forEach(({ file, id }) => {
            fetch(file + '.md')
                .then(res => res.text())
                .then(md => {
                    u("#mymenu").append(u(
                        `<a 
                            class="poemtitle" 
                            href=${"#" + id}
                        >
                            ${file}
                        </a>`
                    ))
                    u(".main").append(`<section id=${id}></section>`)
                    u("#" + id).html(marked.parse(md));
                    u("#" + id).addClass("hidden");

                    syncFocusFromHash();
                })
                .catch(error => {
                    u("#" + id).html(`<div class="error">Error loading Notes.md: ${error.message}</div>`);
                });
        })

        function changeFocus(target, group) {
            u(group).each(el => { u(el).removeClass("focus") })
            u(target).addClass("focus")
        }

        // both the highlighted title and the displayed poem follow the URL
        // hash; deriving them from clicks alone leaves the previous title
        // marked after the browser's back and forward buttons, and leaves the
        // page blank when a poem URL is opened or reloaded directly
        function syncFocusFromHash() {
            const id = location.hash.slice(1);
            const link = id && document.querySelector('.poemtitle[href="#' + id + '"]');
            if (link) {
                changeFocus(u(link), ".poemtitle");
            } else {
                u(".poemtitle").each(el => { u(el).removeClass("focus") });
            }

            u("section").each(el => { u(el).removeClass("shown") });
            const section = id && document.getElementById(id);
            if (section) u(section).addClass("shown");
        }

        window.addEventListener('hashchange', syncFocusFromHash);

        // touch menu cycle: when a poem is already selected, the first tap
        // on the collapsed menu only expands it (no navigation); picking a
        // title from the expanded menu navigates and collapses it again
        const navEl = document.querySelector('nav');
        // capture phase, so the check sees the state from before this
        // click's own changeFocus handler sets .focus on the tapped link
        navEl.addEventListener('click', (e) => {
            if (!matchMedia('(pointer: coarse)').matches) return;
            if (!e.target.closest('.poemtitle')) return;
            if (document.querySelector('.focus') && !navEl.classList.contains('open')) {
                e.preventDefault();
                navEl.classList.add('open');
            } else {
                navEl.classList.remove('open');
            }
        }, true);

        // a tap outside the nav collapses the menu to the active title
        document.addEventListener('pointerdown', (e) => {
            if (!e.target.closest('nav')) {
                navEl.classList.remove('open');
                if (document.activeElement) document.activeElement.blur();
            }
        });

    </script>
</body>
</html>
